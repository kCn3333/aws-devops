---
- hosts: all
  become: true
  tasks:
    - name: Install Apache web server
      apt:
        name: apache2
        state: present
        update_cache: yes
    - name: Ensure Apache is running and enabled on boot
      service:
        name: apache2
        state: started
        enabled: yes
    - name: Verify Apache installation
      shell: systemctl status apache2
      register: apache_status
    - name: Print Apache status         
      debug:    
        var: apache_status.stdout 
    - name: Create a simple index.html page
      copy:
        dest: /var/www/html/index.html
        content: "<html><body><h1>Welcome to Apache on Ansible!</h1></body></html>"